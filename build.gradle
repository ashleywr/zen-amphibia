plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenLocal()
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url = "https://api.modrinth.com/maven" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.DEBUG
            jvmArgument '-ea'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,LOADING'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    devLocalMods {
        canBeConsumed = false
        canBeResolved = true
    }
    createReferenceSources {
        canBeConsumed = false
        canBeResolved = true
    }
    neoforgeReferenceSources {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

dependencies {
    compileOnly fileTree(dir: '../Atelier/build/libs', include: 'zen_atelier-*.jar')
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    createReferenceSources("com.simibubi.create:create-${minecraft_version}:${create_version}:sources@jar") { transitive = false }
    neoforgeReferenceSources("net.neoforged:neoforge:${neo_version}:sources")
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    implementation(jarJar("io.github.llamalad7:mixinextras-neoforge:0.5.4"))
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.4'

    def prismMods = project.fileTree(project.file("${prism_instance_dir}/mods"))
    prismMods.include('Patchouli*.jar')
    localRuntime prismMods

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.7.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('buildEmi', Exec) {
    group = 'neoforge runs'
    description = 'Builds the latest EMI JAR from its source project.'
    workingDir = file('../EMI')
    commandLine = ['.\\gradlew.bat', ':neoforge:build', '-x', 'test']
}

tasks.register('buildAmi', Exec) {
    group = 'neoforge runs'
    description = 'Builds the latest AMI JAR from its source project.'
    workingDir = file('../../AutomatedMaterialsIndex')
    commandLine = ['.\\gradlew.bat', 'build', '-x', 'test']
}

tasks.register('buildAtelier', Exec) {
    group = 'neoforge runs'
    description = 'Builds the latest Zen Atelier JAR from its source project.'
    workingDir = file('../Atelier')
    commandLine = ['.\\gradlew.bat', 'build', '-x', 'test']
}

tasks.register('syncDevLocalMods', Sync) {
    group = 'neoforge runs'
    description = 'Copies local builds of AMI, Zen Atelier, and EMI into the run mods folder for dev client testing.'

    def modsDir = project.file('run/mods')

    into modsDir
    from fileTree(file('../../AutomatedMaterialsIndex/build/libs')) {
        include 'ami-*.jar'
    }
    from fileTree(file('../Atelier/build/libs')) {
        include 'zen_atelier-*.jar'
    }
    from fileTree(file('../EMI/neoforge/build/libs')) {
        include 'emi-*+neoforge.jar'
        exclude '*api*'
        exclude '*source*'
        exclude '*dev-shadow*'
    }

    doFirst {
        modsDir.mkdirs()
    }

    doLast {
        modsDir.listFiles()?.findAll { it.name.endsWith('.jar') }?.each {
            logger.lifecycle("Dev mod staged: ${it.name}")
        }
    }

    dependsOn buildEmi, buildAmi, buildAtelier
}

tasks.register('syncMinecraftReferenceSources', Sync) {
    group = 'documentation'
    description = 'Resolves and extracts the NeoForge sources jar into internal/reference-sources.'
    def sourceConfiguration = configurations.named('neoforgeReferenceSources')
    from({ zipTree(sourceConfiguration.get().singleFile) })
    into(layout.projectDirectory.dir("internal/reference-sources/minecraft-${minecraft_version}-neoforge-${neo_version}"))
}

tasks.register('syncCreateReferenceSources', Sync) {
    group = 'documentation'
    description = 'Extracts the exact Create sources used by this workspace into ignored internal/reference-sources.'

    def mcVersion = project.property('minecraft_version').toString()
    def createVersion = project.property('create_version').toString()
    def referenceDir = layout.projectDirectory.dir("internal/reference-sources/create-${mcVersion}-${createVersion}")

    from(providers.provider {
        def sourceArtifacts = configurations.createReferenceSources.resolve()
        if (sourceArtifacts.isEmpty()) {
            throw new GradleException("Could not resolve Create sources for create-${mcVersion}:${createVersion}")
        }
        zipTree(sourceArtifacts.iterator().next())
    }) {
        include '**/*.java'
        include '**/*.json'
        include '**/*.lang'
        include '**/*.mcmeta'
    }
    into referenceDir

    doLast {
        def readme = referenceDir.file('README.md').asFile
        def resolvedJar = configurations.createReferenceSources.singleFile
        readme.text = """# Reference Sources

Generated by `./gradlew syncCreateReferenceSources`.

These are local, git-ignored reference sources for this workspace:
- Minecraft: ${mcVersion}
- Create: ${createVersion}
- Source jar: ${resolvedJar}

Use these files when checking Create block entity, logistics, renderer, and package handling contracts. Do not edit these files by hand.
"""
    }
}

tasks.register('syncReferenceSources') {
    group = 'documentation'
    description = 'Resolves and extracts NeoForge and Create sources jars into internal/reference-sources.'
    dependsOn tasks.named('syncMinecraftReferenceSources')
    dependsOn tasks.named('syncCreateReferenceSources')
}

tasks.named('prepareClientRun').configure {
    dependsOn syncDevLocalMods
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:removal', '-Werror']
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

