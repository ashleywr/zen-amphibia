plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenLocal()
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven { url = "https://api.modrinth.com/maven" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            logLevel = org.slf4j.event.Level.DEBUG
            jvmArgument '-ea'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'SCAN,REGISTRIES,LOADING'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    devLocalMods {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    compileOnly files('../Atelier/build/libs/zen_atelier-1.0.0.jar')
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    implementation(jarJar("io.github.llamalad7:mixinextras-neoforge:0.5.4"))
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.4'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.7.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.7.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('buildEmi', Exec) {
    group = 'neoforge runs'
    description = 'Builds the latest EMI JAR from its source project.'
    workingDir = file('../EMI')
    commandLine = ['.\\gradlew.bat', ':neoforge:build', '-x', 'test']
}

tasks.register('buildAmi', Exec) {
    group = 'neoforge runs'
    description = 'Builds the latest AMI JAR from its source project.'
    workingDir = file('../../AutomatedMaterialsIndex')
    commandLine = ['.\\gradlew.bat', 'build', '-x', 'test']
}

tasks.register('buildAtelier', Exec) {
    group = 'neoforge runs'
    description = 'Builds the latest Zen Atelier JAR from its source project.'
    workingDir = file('../Atelier')
    commandLine = ['.\\gradlew.bat', 'build', '-x', 'test']
}

tasks.register('syncDevLocalMods', Sync) {
    group = 'neoforge runs'
    description = 'Copies local builds of AMI, Zen Atelier, and EMI into the run mods folder for dev client testing.'

    def modsDir = project.file('run/mods')

    into modsDir
    from fileTree(file('../../AutomatedMaterialsIndex/build/libs')) {
        include 'ami-*.jar'
    }
    from fileTree(file('../Atelier/build/libs')) {
        include 'zen_atelier-*.jar'
    }
    from fileTree(file('../EMI/neoforge/build/libs')) {
        include 'emi-*+neoforge.jar'
        exclude '*api*'
        exclude '*source*'
        exclude '*dev-shadow*'
    }

    doFirst {
        modsDir.mkdirs()
    }

    doLast {
        modsDir.listFiles()?.findAll { it.name.endsWith('.jar') }?.each {
            logger.lifecycle("Dev mod staged: ${it.name}")
        }
    }

    dependsOn buildEmi, buildAmi, buildAtelier
}

tasks.named('prepareClientRun').configure {
    dependsOn syncDevLocalMods
}

test {
    useJUnitPlatform()
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

